<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>NAVER AD API — 문서 주소 이전 안내 (This documentation has moved)</title>
  <meta name="robots" content="noindex">
  <script>
    // 구 국문 사이트(openapi-guide 계열) → 통합 사이트(/developers, 국문=root) 경로 보존 redirect.
    // index.html과 404.html에 동일하게 배포된다 — GitHub Pages는 존재하지 않는 경로에 404.html을
    // 서빙하므로, 이 스크립트가 모든 하위 경로를 받아 새 주소로 넘긴다. (ADS-9198, 2026-07-20 canonical=/developers 반전)
    (function () {
      var MAP = [
        { oldBase: '/performance-ad/pa-openapi-guide', newBase: '/performance-ad/pa-openapi-developers' },
        { oldBase: '/openapi-guide', newBase: '/developers' },
      ];
      var path = window.location.pathname;
      for (var i = 0; i < MAP.length; i++) {
        var m = MAP[i];
        if (path === m.oldBase || path.indexOf(m.oldBase + '/') === 0) {
          // 구 guide 주소는 국문 사용자 대상이고 통합 사이트 root가 국문이므로 경로를 그대로 보존한다.
          var rest = path.slice(m.oldBase.length);
          window.location.replace(m.newBase + rest + window.location.search + window.location.hash);
          return;
        }
      }
      // 매칭 실패 시(예상 밖 배포 경로): 외부 통합 사이트 홈으로.
      window.location.replace('https://naver-ad-api.github.io/developers/');
    })();
  </script>
  <meta http-equiv="refresh" content="3; url=https://naver-ad-api.github.io/developers/">
</head>
<body>
  <p>이 문서는 새 주소로 이전되었습니다. 잠시 후 자동으로 이동합니다.</p>
  <p>This documentation has moved. You will be redirected shortly.</p>
  <p><a href="https://naver-ad-api.github.io/developers/">https://naver-ad-api.github.io/developers/</a></p>
</body>
</html>
