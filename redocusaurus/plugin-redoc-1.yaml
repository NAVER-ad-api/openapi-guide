          format: int64
        - name: adSetNo
          in: path
          description: adSetNo
          required: true
          type: integer
          format: int64
        - name: version
          in: path
          description: API 버전
          required: true
          type: number
          default: 1
          format: float
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/OpenCustomTargetView'
        '400':
          description: 잘못된 요청입니다.
          schema:
            $ref: '#/definitions/ErrorResult'
        '422':
          description: 처리할 수 없는 상태입니다.
          schema:
            $ref: '#/definitions/ErrorResult'
      deprecated: false
    put:
      tags:
        - Ad groups
      summary: 고객파일 타겟 수정
      description: >-
        - 기존의 정의된 고객파일 타겟은 삭제되고, 요청한 타겟 리스트로 재정의 됩니다.

        - 사용 가능 상태의 타겟을 최대 30개까지 선택 할 수 있으며 타겟 모수가 1,000 미만인 경우 포함(타게팅) 설정 할 수
        없습니다.
      operationId: editCustomizedTargetingAdidLibraryUsingPUT
      consumes:
        - application/json
      produces:
        - '*/*'
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          type: integer
          format: int64
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          type: integer
          format: int64
        - name: adSetNo
          in: path
          description: adSetNo
          required: true
          type: integer
          format: int64
        - in: body
          name: params
          description: params
          required: true
          schema:
            $ref: '#/definitions/CreateCustomizedTargetingAdidLibrariesRequest'
        - name: version
          in: path
          description: API 버전
          required: true
          type: number
          default: 1
          format: float
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/CustomTargetParam'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorResult'
        '422':
          description: Unprocessable
          schema:
            $ref: '#/definitions/ErrorResult'
      deprecated: false
