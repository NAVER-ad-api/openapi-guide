definitions:
  AdSetBidAndBudgetEditParam:
    type: object
    required:
      - adSetNos
      - editType
    discriminator: editType
    properties:
      adSetNos:
        type: array
        description: 광고그룹no 목록
        items:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
      editType:
        type: string
        description: 변경 파라미터 구분
    title: AdSetBidAndBudgetEditParam
  AdSetDemographicParam:
    type: object
    properties:
      adultOnly:
        type: boolean
        description: 성인 타겟팅 여부
      ageRanges:
        type: array
        description: 연령
        items:
          type: string
          enum:
            - AGE_14_18
            - AGE_19_24
            - AGE_25_29
            - AGE_30_34
            - AGE_35_39
            - AGE_40_44
            - AGE_45_49
            - AGE_50_54
            - AGE_55_59
            - OVER_60
            - UNKNOWN
      extensionDemos:
        type: array
        description: 확장 데모
        items:
          type: integer
          format: int32
      genders:
        type: array
        description: "성별\r\n- 사용 가능한 값: `M`,`F`,`U`"
        items:
          type: string
          enum:
            - M
            - F
            - U
      includeUnknownLocation:
        type: boolean
        description: '지역 : 비해당자 포함 여부'
      locations:
        type: array
        description: 지역
        items:
          type: string
    title: AdSetDemographicParam
  AdSetDeviceAndPlacementGroupParam:
    type: object
    properties:
      allDevice:
        type: boolean
        description: 노출 가능한 모든 디바이스 선택 여부
      allPlacementGroup:
        type: boolean
        description: 노출 가능한 모든 게재위치 선택 여부
      devices:
        type: array
        description: "디바이스 타입\r\n- 사용 가능한 값: `DESKTOP`,`MOBILE`"
        items:
          type: string
          enum:
            - DESKTOP
            - MOBILE
      placementGroupCodes:
        type: array
        description: 게재 위치
        items:
          type: string
          enum:
            - M_SMARTCHANNEL
            - M_MAIN
            - M_BANNER
            - M_FEED
            - N_INSTREAM
            - N_SHOPPING
            - N_COMMUNICATION
            - F_SMARTCHANNEL
            - F_BANNER
            - BAND
            - NW_SMARTCHANNEL
            - NW_FEED
            - NW_BANNER
      platforms:
        type: array
        description: "운영체제\r\n- 사용 가능한 값: `ANDROID`,`IOS`"
        items:
          type: string
          enum:
            - ANDROID
            - IOS
    title: AdSetDeviceAndPlacementGroupParam
  AdSetEditBidPriceParam:
    title: AdSetEditBidPriceParam
    allOf:
      - $ref: '#/definitions/AdSetBidAndBudgetEditParam'
      - type: object
        required:
          - adSetNos
          - bidPrice
          - editType
        properties:
          adSetNos:
            type: array
            description: 광고그룹no 목록
            items:
              type: integer
              format: int64
              minimum: 1
              maximum: 100
          bidPrice:
            type: number
            example: 10000
            description: 입찰가
          bidType:
            type: string
            description: "청구 기준\r\n- 사용 가능한 값: `CPC`,`CPM`,`CPV`"
            enum:
              - CPC
              - CPM
              - CPV
          editType:
            type: string
            description: 변경 파라미터 구분
        title: AdSetEditBidPriceParam
  AdSetEditBidStrategyValueParam:
    title: AdSetEditBidStrategyValueParam
    allOf:
      - $ref: '#/definitions/AdSetBidAndBudgetEditParam'
