          required: false
          type: integer
          format: int64
        - name: activated
          in: query
          description: 'ON/OFF 설정. (예, true : ON)'
          required: false
          type: boolean
          allowEmptyValue: false
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          type: integer
          format: int64
        - name: adSetNos
          in: query
          description: 광고 그룹 ID 목록
          required: false
          type: array
          items:
            type: integer
            format: int64
          collectionFormat: multi
          maximum: 100
          minimum: 1
          allowEmptyValue: false
        - name: version
          in: path
          description: API 버전
          required: true
          type: number
          default: 1
          format: float
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
      deprecated: false
  /{version}/adAccounts/{adAccountNo}/adSets/edit:
    post:
      tags:
        - 광고 그룹
