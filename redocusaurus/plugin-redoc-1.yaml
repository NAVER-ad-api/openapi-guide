swagger: '2.0'
info:
  title: 광고 API
  description: >-
    <b>공통 HEADER PARAMETERS</b><br/> - `AccessManagerAccountNo`: 해당 광고 계정에 대한 접근
    권한이 있는 관리 계정 ID. 관리계정으로만 멤버인 경우, 이 값을 포함해서 호출해야 광고계정에 대한 호출이 가능합니다.
host: openapi.naver.com
basePath: /v1/ad-api
tags:
  - name: 캠페인
  - name: 광고 그룹
  - name: 광고 소재
  - name: 타겟팅 상세
  - name: 타입 정보
  - name: 잠재고객
paths:
  /{version}/adAccounts/{adAccountNo}/adSets:
    get:
      tags:
        - 광고 그룹
      summary: 광고 그룹 목록
      operationId: getListUsingGET
      produces:
        - '*/*'
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          type: integer
          format: int64
        - name: activated
          in: query
          description: 광고 그룹 ON/OFF 여부. 미입력 시 모든 광고 그룹을 검색합니다.
          required: false
          type: boolean
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          type: integer
          format: int64
        - name: budgetTypes
          in: query
          description: 광고 그룹의 예산 타입
          required: false
          type: array
          items:
            type: string
            enum:
              - DAILY
              - TOTAL
          collectionFormat: multi
          enum:
            - DAILY
            - TOTAL
        - name: campaignNo
          in: query
          description: 상위 캠페인 ID
          required: false
          type: integer
          format: int64
        - name: deleteOnly
          in: query
          description: >-
            삭제된 광고 그룹만 검색. true 인 경우 삭제된 광고 그룹, false 인 경우 운영가능/광고집행전/광고집행종료 상태의
            광고 그룹을 검색합니다.
          required: false
          type: boolean
        - name: page
          in: query
          description: '페이지 번호 (기본값: 0)'
          required: false
          type: integer
          format: int32
        - name: placementGroupCodes
          in: query
          description: 광고 그룹의 게재 위치
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: size
          in: query
          description: '페이지 크기 (기본값: 10, 최대: 100)'
          required: false
          type: integer
          format: int32
        - name: version
          in: path
          description: API 버전
          required: true
          type: number
          default: 1
          format: float
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Page«OpenAdSetListView»'
      deprecated: false
    post:
      tags:
        - 광고 그룹
      summary: 광고 그룹 만들기
      operationId: createAdSetUsingPOST
      consumes:
        - application/json
      produces:
        - '*/*'
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          type: integer
          format: int64
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          type: integer
          format: int64
        - in: body
          name: params
          description: params
          required: true
          schema:
            $ref: '#/definitions/OpenAdSetCreationParam'
        - name: version
          in: path
          description: API 버전
          required: false
          type: number
          default: 1
          format: float
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/OpenAdSetCreationParam'
      deprecated: false
    delete:
      tags:
        - 광고 그룹
      summary: 광고 그룹 다중 삭제
      operationId: deleteAdSetsUsingDELETE
      produces:
        - '*/*'
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          type: integer
          format: int64
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          type: integer
          format: int64
        - name: adSetNos
          in: query
          description: 광고 그룹 ID 목록
          required: false
          type: array
          items:
            type: integer
            format: int64
          collectionFormat: multi
          maximum: 100
          minimum: 1
          allowEmptyValue: false
        - name: version
          in: path
          description: API 버전
          required: true
          type: number
          default: 1
          format: float
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
      deprecated: false
  /{version}/adAccounts/{adAccountNo}/adSets/activate:
    post:
      tags:
        - 광고 그룹
      summary: 광고 그룹 ON/OFF 다중 변경
