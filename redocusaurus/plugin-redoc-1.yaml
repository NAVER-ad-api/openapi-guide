        required:
          - adSetNos
          - editType
        properties:
          adSetNos:
            type: array
            description: 광고그룹no 목록
            items:
              type: integer
              format: int64
              minimum: 1
              maximum: 100
          bidGoal:
            type: string
            description: "입찰 전략\r\n- 사용 가능한 값: `MAX_CONV`,`MAX_CLICK`,`MAX_CONV_VALUE`"
            enum:
              - MAX_CLICK
              - MAX_CONV
              - MAX_CONV_VALUE
          bidStrategy:
            type: string
            description: "비용 관리\r\n- 사용 가능한 값: `BID_CAP`,`COST_CAP`,`NO_CAP`"
            enum:
              - BID_CAP
              - COST_CAP
              - NO_CAP
              - TARGET_COST
          bidStrategyValue:
            type: number
            example: 100000
            description: 입찰가/비용 한도
          editType:
            type: string
            description: 변경 파라미터 구분
        title: AdSetEditBidStrategyValueParam
